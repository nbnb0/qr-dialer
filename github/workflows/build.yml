name: Build QR Telephone APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Project
      run: |
        mkdir -p app/src/main/java/com/example/qrdialer
        mkdir -p app/src/main/res/layout

        echo "include(':app')" > settings.gradle.kts
        
        echo 'plugins { id("com.android.application") version "8.1.4" apply false; id("org.jetbrains.kotlin.android") version "1.9.20" apply false }' > build.gradle.kts
        
        echo 'plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
        android { namespace = "com.example.qrdialer"; compileSdk = 34
        defaultConfig { applicationId = "com.example.qrdialer"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "1.0" } }
        dependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.appcompat:appcompat:1.6.1"); implementation("com.google.android.material:material:1.11.0"); implementation("com.journeyapps:zxing-android-embedded:4.3.0") }' > app/build.gradle.kts

        # Манифест
        echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="QR Telephone" android:theme="@style/Theme.Material3.DayNight.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:category="android.intent.category.LAUNCHER" /></intent-filter><intent-filter><action android:name="android.intent.action.DIAL" /><category android:category="android.intent.category.DEFAULT" /></intent-filter><intent-filter><action android:name="android.intent.action.VIEW" /><category android:category="android.intent.category.DEFAULT" /><category android:category="android.intent.category.BROWSABLE" /><data android:scheme="tel" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

        # Layout
        echo '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="center" android:orientation="vertical"><TextView android:id="@+id/numberTextView" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Номер" android:textSize="26sp" /><ImageView android:id="@+id/qrImageView" android:layout_width="300dp" android:layout_height="300dp" /></LinearLayout>' > app/src/main/res/layout/activity_main.xml

        # MainActivity
        echo 'package com.example.qrdialer
        import android.os.Bundle; import android.widget.ImageView; import android.widget.TextView; import androidx.appcompat.app.AppCompatActivity; import com.google.zxing.BarcodeFormat; import com.journeyapps.barcodescanner.BarcodeEncoder
        class MainActivity : AppCompatActivity() { override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); setContentView(R.layout.activity_main); val num = intent?.data?.schemeSpecificPart?.replace(Regex("[^0-9]"), "") ?: ""; findViewById<TextView>(R.id.numberTextView).text = num; findViewById<ImageView>(R.id.qrImageView).setImageBitmap(BarcodeEncoder().encodeBitmap(num, BarcodeFormat.QR_CODE, 600, 600)) } }' > app/src/main/java/com/example/qrdialer/MainActivity.kt

    - name: Build
      run: |
        chmod +x gradlew || true
        ./gradlew assembleDebug --no-daemon

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: app
        path: app/build/outputs/apk/debug/app-debug.apk
        
